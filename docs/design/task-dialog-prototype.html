<div class="page-label"><span>SkillsHub / 任务弹窗设计确认稿</span><span>仅演示数据 · 操作不会影响技能或真实任务</span></div>
<div class="app-frame"><div class="app-title">SkillsHub</div><div class="app-context"><span class="current">技能仓库</span><span>技能合集</span><span>共享中心</span><span class="grow"></span><span>搜索技能…</span></div><div class="overlay"><section class="dialog" role="dialog" aria-label="任务设计稿"><div class="dialog-head flex between"><span class="title">任务</span><div class="flex"><span class="muted small">关闭窗口后，任务继续运行</span><button class="close" aria-label="关闭设计预览" onclick="toast('这是独立设计稿；关闭真实任务窗口后，后台任务继续运行。')">×</button></div></div><div id="tabs" class="tabs" role="tablist"></div><div id="content" class="body"></div></section></div><div class="app-status"><span>技能仓库 · 技能 810 / 810</span><button onclick="toast('状态栏入口统一命名为「任务」')">☷ 任务 · 运行中 2 · 待处理 7</button></div></div>
<div class="notes"><p><b>推荐 A · 任务列表 + 明细</b><br>先选择一个仓库／批次，再处理技能明细。进行中、需处理的任务靠前；任务与结果有明确归属。</p><p><b>操作规则</b><br>停止用于运行中任务；完成、失败、已停止任务可删除记录。清空检查结果只清结果，保留技能文件。检查入口仍在主界面。</p><p><b>确认重点</b><br>两类一级标签、任务状态筛选、更新结果分类、任务级操作与底部批量操作的位置是否合适？</p></div>
<div class="prototype-controls"><button onclick="cycle(-1)" aria-label="上一个方案">←</button><span id="variant-label"></span><button onclick="cycle(1)" aria-label="下一个方案">→</button><span style="opacity:.5">|</span><button onclick="reset()" aria-label="重置演示">↺</button></div><div id="toast" hidden class="toast" role="status"></div>
<script>
const names={A:'A · 左侧任务 + 右侧明细（推荐）',B:'B · 全宽任务列表 + 展开明细',C:'C · 状态分栏 + 下方明细'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
let tab='update',filter='attention',scope='all',selected='u1',query='',checked=new Set(),timer;
const initial=()=>[
 {id:'i1',kind:'import',name:'example/scientific-skills',status:'running',time:'21:06',desc:'正在复制技能文件',done:110,total:177},
 {id:'i2',kind:'import',name:'example/design-toolkit',status:'waiting',time:'21:02',desc:'2 个同名技能需要确认',done:6,total:8},
 {id:'i3',kind:'import',name:'example/research-tools',status:'failed',time:'20:54',desc:'1 个技能导入失败',done:11,total:12},
 {id:'i4',kind:'import',name:'本地技能文件夹',status:'success',time:'20:48',desc:'已导入 5 个技能',done:5,total:5},
 {id:'u1',kind:'update',name:'全仓库检查',status:'waiting',time:'20:50',desc:'7 个技能待处理 · 1 个仓库检查失败',done:778,total:778},
 {id:'u2',kind:'update',name:'批量更新 · 12 个技能',status:'running',time:'21:08',desc:'已完成 8 / 12 项',done:8,total:12},
 {id:'u3',kind:'update',name:'example/diagram-skills',status:'success',time:'20:42',desc:'已更新 3 个技能',done:3,total:3}];
let tasks=initial();
const updateRows=()=>[
 {id:'r1',name:'literature-review',repo:'example/research-tools',change:'内容修改',state:'待更新',group:'attention'},
 {id:'r2',name:'paper-figure',repo:'example/visual-tools',change:'新增',state:'待导入',group:'attention'},
 {id:'r3',name:'legacy-diagram',repo:'example/diagram-skills',change:'来源已删除',state:'需确认',group:'attention'},
 {id:'r4',name:'data-analysis',repo:'example/scientific-skills',change:'内容修改',state:'待更新',group:'attention'},
 {id:'r5',name:'presentation',repo:'example/design-toolkit',change:'新增',state:'待导入',group:'attention'},
 {id:'r6',name:'image-export',repo:'example/visual-tools',change:'内容修改',state:'待更新',group:'attention'},
 {id:'r7',name:'citation-format',repo:'example/research-tools',change:'内容修改',state:'更新失败',group:'attention'},
 {id:'r8',name:'仓库检查失败',repo:'example/offline-tools',change:'连接超时',state:'检查失败',group:'checkFailed'},
 ...Array.from({length:34},(_,i)=>({id:'d'+i,name:['diagram-layout','markdown-export','table-format'][i%3]+'-'+(i+1),repo:'example/diagram-skills',change:'内容修改',state:'已更新',group:'done'})),
 ...Array.from({length:737},(_,i)=>({id:'n'+i,name:'skill-'+(i+1),repo:'example/scientific-skills',change:'无变化',state:'无变化',group:'unchanged'}))];
let rows=updateRows();
const labels={running:'进行中',waiting:'需处理',failed:'失败',success:'已完成',stopped:'已停止'};
const color=s=>s==='running'?'blue':s==='waiting'?'orange':s==='failed'?'red':s==='success'?'green':'muted';
function toast(message){clearTimeout(timer);const t=document.getElementById('toast');t.textContent=message;t.hidden=false;timer=setTimeout(()=>t.hidden=true,3200)}
function current(){return tasks.find(t=>t.id===selected)}
function list(){return tasks.filter(t=>t.kind===tab&&(scope==='all'||scope==='finished'?scope==='all'||['success','stopped'].includes(t.status):t.status===scope))}
function switchTab(next){tab=next;scope='all';filter=tab==='update'?'attention':'all';query='';checked.clear();selected=tasks.find(t=>t.kind===tab)?.id;render()}
function pick(id){selected=id;filter=tab==='update'&&id==='u1'?'attention':'all';query='';checked.clear();render()}
function taskActions(t){if(!t)return '';return t.status==='running'?`<button onclick="action('stop','${t.id}')">停止</button>`:t.status==='waiting'&&t.kind==='import'?`<button class="primary" onclick="action('resolve','${t.id}')">处理冲突</button><button class="ghost" onclick="action('delete','${t.id}')">删除记录</button>`:t.status==='failed'?`<button onclick="action('retry','${t.id}')">重试失败项</button><button class="ghost" onclick="action('delete','${t.id}')">删除记录</button>`:`<button class="ghost" onclick="action('${t.id==='u1'?'clear':'delete'}','${t.id}')">${t.id==='u1'?'清空检查结果':'删除记录'}</button>`}
function action(a,id){const t=tasks.find(t=>t.id===id);if(a==='stop'){t.status='stopped';t.desc='已停止，已完成的操作保留';toast('演示：任务已停止，现在可以删除记录。')}if(a==='delete'||a==='clear'){if(!confirm(a==='clear'?'清空本批次检查结果？技能文件会保留。':'删除这条任务记录？已导入或更新的技能会保留。'))return;tasks=tasks.filter(t=>t.id!==id);selected=tasks.find(t=>t.kind===tab)?.id;checked.clear();toast('演示：已移除记录，技能文件保留。')}if(a==='retry'){t.status='running';t.desc='正在重试失败项';toast('演示：仅重试失败项。')}if(a==='resolve'){toast('正式实现将打开同名技能确认界面，选择跳过或覆盖。')}render()}
function clean(){const ids=list().filter(t=>['success','stopped'].includes(t.status)).map(t=>t.id);tasks=tasks.filter(t=>!ids.includes(t.id));if(!current())selected=tasks.find(t=>t.kind===tab)?.id;render();toast('演示：已清理完成和已停止的记录，保留失败及运行中的任务。')}
function taskCard(t){return `<button class="task ${selected===t.id?'selected':''}" onclick="pick('${t.id}')"><div class="task-top"><span class="${color(t.status)}"><i class="dot"></i>${labels[t.status]}</span><span class="muted">${t.time}</span></div><div class="task-title">${t.name}</div><div class="task-sub">${t.desc}</div>${t.status==='running'?`<div class="bar"><i style="width:${t.done/t.total*100}%"></i></div>`:''}</button>`}
function scopeControl(){return `<select aria-label="任务状态筛选" onchange="scope=this.value;render()">${[['all','全部任务'],['running','进行中'],['waiting','需处理'],['failed','失败'],['finished','已完成 / 已停止']].map(([v,n])=>`<option value="${v}" ${scope===v?'selected':''}>${n} ${tasks.filter(t=>t.kind===tab&&(v==='all'||v==='finished'?v==='all'||['success','stopped'].includes(t.status):t.status===v)).length}</option>`).join('')}</select>`}
function importRows(t){return Array.from({length:Math.min(t.total,177)},(_,i)=>({id:t.id+'-'+i,name:['scientific-writing','data-visualization','literature-search','figure-design'][i%4]+'-'+(i+1),repo:t.name,change:'',state:t.status==='failed'&&i>=t.done?'导入失败':t.status==='waiting'&&i>=t.done?'同名冲突':i<t.done?'已导入':t.status==='stopped'?'未导入':'等待导入',group:t.status==='failed'&&i>=t.done?'failed':t.status==='waiting'&&i>=t.done?'waiting':i<t.done?'done':'queued'}))}
function shownRows(){const t=current();if(!t)return [];let data=tab==='import'?importRows(t):t.id==='u1'?rows:t.id==='u2'?Array.from({length:12},(_,i)=>({id:'b'+i,name:'skill-'+(i+1),repo:'example/scientific-skills',change:'内容修改',state:i<8?'已更新':'更新中',group:i<8?'done':'running'})):rows.filter(r=>r.group==='done').slice(0,3);return data.filter(r=>(filter==='all'||filter==='failed'?filter==='all'||r.state.includes('失败'):filter==='attention'?r.group==='attention'||r.group==='waiting':r.group===filter)&&(filter!=='all'||r.group!=='checkFailed')&&(!query||(r.name+r.repo).toLowerCase().includes(query.toLowerCase())))}
function filters(){const items=tab==='update'&&selected==='u1'?[['attention','待处理 7'],['failed','失败 2'],['done','已更新 34'],['all','全部技能 778'],['unchanged','无变化 737'],['ignored','已忽略 0']]:tab==='import'?[['all','全部'],['waiting','需确认'],['failed','失败'],['done','已导入']]:[['all','全部'],['running','进行中'],['done','已更新'],['failed','失败']];return `<div class="filters">${items.map(([id,label])=>`<button class="${filter===id?'active':''}" onclick="filter='${id}';checked.clear();render()">${label}</button>`).join('')}</div>`}
function table(){const data=shownRows();return `<table><thead><tr><th style="width:32px"><input type="checkbox" aria-label="选择可操作项" onchange="selectAll(this.checked)"></th><th>技能${tab==='update'?' / 仓库':''}</th>${tab==='update'?'<th style="width:90px">变化</th>':''}<th style="width:86px">状态</th><th style="width:68px">操作</th></tr></thead><tbody>${data.map(r=>{const actionable=!(r.group==='done'||r.group==='unchanged'||r.group==='running'||r.state==='等待导入'||r.state==='未导入');return `<tr><td><input type="checkbox" aria-label="选择 ${r.name}" ${checked.has(r.id)?'checked':''} ${actionable?'':'disabled'} onchange="check('${r.id}',this.checked)"></td><td>${r.name}${tab==='update'?`<div class="sub">${r.repo}</div>`:''}</td>${tab==='update'?`<td class="${r.change==='来源已删除'?'orange':'muted'}">${r.change}</td>`:''}<td class="${r.state.includes('失败')?'red':r.state.includes('冲突')||r.state==='需确认'?'orange':r.group==='done'?'green':'muted'}">${r.state}</td><td>${r.state.includes('失败')?'<button class="row-action" onclick="toast(\'演示：重试该失败项\')">重试</button>':r.state==='需确认'||r.state.includes('冲突')?'<button class="row-action" onclick="toast(\'正式实现将展开来源删除或同名冲突的处理选项\')">处理</button>':'—'}</td></tr>`}).join('')}</tbody></table>${!data.length?'<div class="empty">当前分类没有任务明细</div>':''}`}
function detailHeader(){const t=current();if(!t)return '';return `<div class="detail-head"><div class="flex between"><div class="grow"><div class="detail-title">${t.name}</div><span class="muted small">${t.kind==='import'?'技能导入':'技能更新'} · 今天 ${t.time} · <span class="${color(t.status)}">${labels[t.status]}</span></span></div><div class="flex detail-actions">${taskActions(t)}</div></div><div class="summary">${tab==='import'?`<span><b>${t.total}</b> 个技能</span><span><b>${t.done}</b> 已导入</span><span><b>${t.total-t.done}</b> ${t.status==='waiting'?'需确认':t.status==='failed'?'失败':'剩余'}</span>`:t.id==='u1'?'<span><b>778</b> 个技能</span><span><b>7</b> 技能待处理</span><span><b>34</b> 已更新</span><span><b>1</b> 仓库检查失败</span>':`<span><b>${t.done} / ${t.total}</b> 已更新</span>`}</div>${t.status==='running'?`<div class="bar"><i style="width:${t.done/t.total*100}%"></i></div>`:''}</div>`}
function banner(){const t=current();if(!t)return '';return t.id==='u1'?'<div class="banner">默认显示需要处理的变化。“来源已删除”须手动确认；无变化项无需操作。</div>':t.status==='waiting'?'<div class="banner warn">部分技能与本地同名。确认跳过或覆盖后，继续导入其余技能。</div>':t.status==='running'?'<div class="banner">任务在后台运行。停止后保留已完成的技能，可重试剩余项。</div>':''}
function footer(){const eligible=shownRows().filter(r=>!['done','unchanged','running','queued'].includes(r.group));const count=checked.size;return `<div class="footer"><div class="footer-left">${eligible.length?`<label><input type="checkbox" aria-label="全选当前可操作项" onchange="selectAll(this.checked)"> 已选 ${count} 项</label>`:'任务明细 · 点击任务可切换'}</div><div class="flex">${tab==='update'?`<button ${count?'':'disabled'} onclick="batch('ignore')">忽略所选</button><button ${count?'':'disabled'} onclick="batch('recheck')">重查所选</button><button class="primary" ${count?'':'disabled'} onclick="batch('apply')">处理所选${count?' '+count+' 项':''}</button>`:`<span class="muted small">${current()?.status==='running'?'进度实时同步':'已导入的技能会保留'}</span>`}</div></div>`}
function check(id,value){value?checked.add(id):checked.delete(id);const footerElement=document.querySelector('.footer');if(footerElement)footerElement.outerHTML=footer()}
function selectAll(value){checked.clear();if(value)shownRows().filter(r=>!['done','unchanged','running','queued'].includes(r.group)&&r.state!=='等待导入'&&r.state!=='未导入').forEach(r=>checked.add(r.id));render()}
function batch(a){if(a==='apply'){toast('演示：先确认来源删除项，其余所选项加入更新队列；成功后归入「已更新」。')}else if(a==='ignore'){for(const r of rows)if(checked.has(r.id))r.group='ignored';toast('演示：所选项已移入「已忽略」。')}else toast('演示：仅重新检查所选技能／仓库。');checked.clear();render()}
function render(){document.getElementById('variant-label').textContent=names[variant];document.getElementById('tabs').innerHTML=[['import','技能导入'],['update','技能更新']].map(([id,label])=>`<button role="tab" aria-selected="${tab===id}" class="tab ${tab===id?'active':''}" onclick="switchTab('${id}')">${label}<span class="count">${tasks.filter(t=>t.kind===id&&t.status==='running').length} 运行中</span></button>`).join('');const c=document.getElementById('content');c.className='body variant-'+variant;const search=`<div class="search-row"><input class="search" aria-label="搜索任务明细" placeholder="搜索技能${tab==='update'?'或仓库':''}…" value="${query}" oninput="query=this.value;refreshTable()"></div>`;if(variant==='A'){c.innerHTML=`<aside class="rail"><div class="rail-top">${scopeControl()}</div><div class="task-list">${list().map(taskCard).join('')||'<div class="empty">暂无任务</div>'}</div><div class="rail-foot"><button class="ghost" onclick="clean()">清理已完成记录</button></div></aside><section class="detail">${current()?detailHeader()+banner()+filters()+search+`<div class="results">${table()}</div>`:'<div class="empty grow">选择一个任务查看详情</div>'}${footer()}</section>`}else if(variant==='B'){c.innerHTML=`<section class="detail"><div class="flex between" style="padding:14px 22px"><div>${scopeControl()}</div><button class="ghost small" onclick="clean()">清理已完成记录</button></div><div class="wide-list">${list().map(t=>`<div class="wide-task ${t.id===selected?'selected':''}"><div class="flex"><button class="ghost grow" style="text-align:left" onclick="pick('${t.id}')">${t.id===selected?'⌄':'›'} &nbsp; <b>${t.name}</b><span class="muted small">　${t.time} · ${t.desc}</span></button><span class="small ${color(t.status)}">${labels[t.status]}</span><div class="flex detail-actions">${taskActions(t)}</div></div>${t.id===selected?`<div class="expanded-content">${filters()}${table()}</div>`:''}</div>`).join('')||'<div class="empty">暂无任务</div>'}</div>${footer()}</section>`}else{c.innerHTML=`<section class="detail"><div class="board">${[['running','进行中'],['attention','需处理'],['finished','已完成']].map(([id,label])=>`<section class="lane"><div class="lane-title">${label}</div>${tasks.filter(t=>t.kind===tab&&(id==='running'?t.status==='running':id==='attention'?['waiting','failed'].includes(t.status):['success','stopped'].includes(t.status))).map(t=>`<div class="board-card ${t.id===selected?'selected':''}" onclick="pick('${t.id}')"><div class="task-title">${t.name}</div><div class="task-sub">${t.desc}</div><div class="small ${color(t.status)}" style="margin-top:8px">${labels[t.status]} · ${t.time}</div>${t.status==='running'?`<div class="bar"><i style="width:${t.done/t.total*100}%"></i></div>`:''}<div onclick="event.stopPropagation()">${taskActions(t)}</div></div>`).join('')||'<span class="muted small">暂无任务</span>'}</section>`).join('')}</div><div class="board-detail">${current()?`<div class="strong small" style="margin-bottom:8px">${current().name} · 技能明细</div>${filters()}${table()}`:'选择任务查看技能明细'}</div>${footer()}</section>`}}
function refreshTable(){document.querySelector('.results').innerHTML=table()}
function cycle(direction){const all=['A','B','C'];variant=all[(all.indexOf(variant)+direction+3)%3];history.replaceState({},'',location.pathname+'?variant='+variant);render()}
function reset(){tasks=initial();rows=updateRows();switchTab('update');toast('演示数据已重置')}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();
</script></html>
